name: Публикация проверенного предварительного выпуска
on:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: publish-alpha
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Проверка исходников и закрепленной установки
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          test "$(hyperv-opsec-auditor --version)" = "0.1.0a2"
      - name: Испытание точных исходников выпуска
        run: |
          set -euo pipefail
          python -m coverage run --source=hyperv_opsec_auditor -m unittest discover -s tests -v
          python -m coverage report --fail-under=85
          python tools/validate_docs.py
          python tools/scan_secrets.py
          python tools/build_release.py
          python tools/package_smoke.py
      - name: Публикация предварительного выпуска и файлов
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          notes = Path("RELEASE-NOTES.md").read_text(encoding="utf-8")
          prefix = "https://github.com/" + os.environ["GH_REPO"] + "/blob/v0.1.0a2/"
          notes = re.sub(r"\]\((?!https?://)([^)]+)\)", lambda m: "](" + prefix + m[1] + ")", notes)
          Path("/tmp/release-notes.md").write_text(notes, encoding="utf-8")
          PY
          cat >> /tmp/release-notes.md <<NOTES

          ## Проверенные исходники публикации

          Коммит: $GITHUB_SHA
          Запуск сборки, тестов и установки: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          Запуск проверяет только автономный Python с синтетическими данными. Реальные испытания Windows Server Hyper-V/HGS/резервного копирования/восстановления НЕ ВЫПОЛНЕНЫ.
          NOTES
          if gh release view v0.1.0a2 >/dev/null 2>&1; then
            git fetch --depth=1 origin refs/tags/v0.1.0a2
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
            gh release upload v0.1.0a2 dist/* --clobber
            gh release edit v0.1.0a2 --draft=false --prerelease --notes-file /tmp/release-notes.md
          else
            gh release create v0.1.0a2 --target "$GITHUB_SHA" --prerelease --title "0.1.0a2 — автономный аудитор Hyper-V, предварительный выпуск" --notes-file /tmp/release-notes.md dist/*
          fi
